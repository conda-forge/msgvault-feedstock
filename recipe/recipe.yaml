context:
  version: "0.21.0"

package:
  name: msgvault
  version: ${{ version }}

source:
  - url: https://github.com/wesm/msgvault/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 25285e2281238e64f5c72c1a1cc54e8a3f0351b76ea6dfb7c6971f4566276e4f
    target_directory: src

build:
  skip: win
  number: 0
  script:
    - cd src
    # conda-forge's bun reports os.arch() as x64 on linux-aarch64, so esbuild picks the wrong binary
    - if: linux and aarch64
      then: export ESBUILD_BINARY_PATH=$SRC_DIR/src/web/node_modules/@esbuild/linux-arm64/bin/esbuild
    - make web-install web-embed
    - node $RECIPE_DIR/collect-node-licenses.mjs web/node_modules frontend-license-input.json
    - pnpm-licenses generate-disclaimer --json-input-file frontend-license-input.json --output-file frontend_licenses.txt
    - cd cmd/msgvault
    # github.com/segmentio/asm is MIT-0 which go-licenses does not recognize
    - go-licenses save . --save_path ../../../library_licenses --ignore github.com/segmentio/asm${{ ' --ignore github.com/mattn/go-localereader' if win else '' }}
    - mkdir -p ../../../library_licenses/github.com/segmentio/asm
    - cp $(go list -m -f "{{.Dir}}" github.com/segmentio/asm)/LICENSE ../../../library_licenses/github.com/segmentio/asm/LICENSE
    - go build -v -tags "fts5,duckdb_use_lib,libsqlite3" -o $PREFIX/bin/msgvault -ldflags="-s -w -X github.com/wesm/msgvault/cmd/msgvault/cmd.Version=v${PKG_VERSION}"
    - node ../../scripts/check-web-assets.mjs --binary $PREFIX/bin/msgvault
    - if: unix
      then:
        - mkdir -p $PREFIX/share/bash-completion/completions $PREFIX/share/zsh/site-functions $PREFIX/share/fish/vendor_completions.d
        - $PREFIX/bin/msgvault completion bash > $PREFIX/share/bash-completion/completions/msgvault
        - $PREFIX/bin/msgvault completion zsh > $PREFIX/share/zsh/site-functions/_msgvault
        - $PREFIX/bin/msgvault completion fish > $PREFIX/share/fish/vendor_completions.d/msgvault.fish

requirements:
  build:
    - ${{ compiler("go-cgo") }}
    - ${{ compiler("c") }}
    - ${{ compiler("cxx") }}
    - ${{ stdlib("c") }}
    - bun >=1.3,<2
    - go-licenses
    - make
    - nodejs >=20.19,<25
    - pnpm-licenses
  host:
    - libduckdb-devel
    - libsqlite

tests:
  - script:
      - msgvault --help
      - msgvault version
  - package_contents:
      bin:
        - msgvault
      files:
        - if: unix
          then:
            - share/bash-completion/completions/msgvault
            - share/fish/vendor_completions.d/msgvault.fish
            - share/zsh/site-functions/_msgvault
      strict: true

about:
  homepage: https://github.com/wesm/msgvault
  summary: Archive a lifetime of email and chat. Offline search, analytics, and AI query over your full message history. Powered by DuckDB
  description: |
    Your messages are yours. Decades of correspondence, attachments, and history shouldn't be locked behind a web interface or an API. msgvault downloads a complete local copy and then everything runs offline. Search, analytics, and the MCP server all work against local data with no network access required.
  license: MIT
  license_file:
    - src/LICENSE
    - library_licenses/
    - src/frontend_licenses.txt
  documentation: https://pkg.go.dev/github.com/wesm/msgvault
  repository: https://github.com/wesm/msgvault

extra:
  recipe-maintainers:
    - pavelzw
